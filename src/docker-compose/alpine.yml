version: 1.0.6
services:
  SO:
    image: docker.io/library/alpine
    container_name: alpine_os_ubuntu
    volumes:
      - ./working_directory:/working_directory
      - ./code:/code
    working_dir: /working_directory
    command: >-
      /bin/sh -c "apk add --no-cache git && git init && git config --global
      user.email 'you@example.com' && git config --global user.name 'example' &&
      sleep infinity"
    tty: true
